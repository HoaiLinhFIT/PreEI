name: Run PreEI R9
run-name: PreEI R9 - ${{ inputs.dataset }}

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Path to a profit-augmented dataset in the repository (default: Connect)'
        type: string
        required: true
        default: 'datasets/connect.txt'
      lower_threshold:
        description: 'Lower gain threshold (%)'
        type: string
        required: true
        default: '2.5'
      upper_threshold:
        description: 'Upper gain threshold (%)'
        type: string
        required: true
        default: '2.8'
      verify_reference:
        description: 'Verify all 11 stages when a matching reference is available'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  mine:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python for reference validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check the chosen dataset exists
        env:
          PREEI_DATASET: ${{ inputs.dataset }}
        run: |
          if (-not (Test-Path -LiteralPath $env:PREEI_DATASET -PathType Leaf)) {
            Write-Error "Dataset '$env:PREEI_DATASET' not found. Upload the original profit-augmented file under datasets/ and commit it first."
            exit 1
          }

      - name: Build headless runner (R9 algorithm files unchanged)
        run: dotnet build PreEI.Console/PreEI.Console.csproj --configuration Release

      # The split is run in a separate process and is excluded from mining peak MB.
      - name: Split dataset into 80% initial + ten 2% increments
        env:
          PREEI_DATASET: ${{ inputs.dataset }}
        run: |
          $cli = 'PreEI.Console/bin/Release/net10.0/PreEI.Console.dll'
          dotnet $cli split --dataset $env:PREEI_DATASET --parts 'outputs/batches'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mine all 11 stages and export results
        env:
          PREEI_DATASET: ${{ inputs.dataset }}
          PREEI_LOWER: ${{ inputs.lower_threshold }}
          PREEI_UPPER: ${{ inputs.upper_threshold }}
        run: |
          $cli = 'PreEI.Console/bin/Release/net10.0/PreEI.Console.dll'
          dotnet $cli mine --dataset $env:PREEI_DATASET --parts 'outputs/batches' `
            --lower $env:PREEI_LOWER --upper $env:PREEI_UPPER --output 'outputs/results'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify 11 stages against matching reference
        env:
          PREEI_DATASET: ${{ inputs.dataset }}
          PREEI_LOWER: ${{ inputs.lower_threshold }}
          PREEI_UPPER: ${{ inputs.upper_threshold }}
          PREEI_VERIFY: ${{ inputs.verify_reference }}
        run: |
          $datasetName = [System.IO.Path]::GetFileName($env:PREEI_DATASET)
          $datasetStem = [System.IO.Path]::GetFileNameWithoutExtension($env:PREEI_DATASET)
          $lower = [double]::Parse($env:PREEI_LOWER, [System.Globalization.CultureInfo]::InvariantCulture)
          $upper = [double]::Parse($env:PREEI_UPPER, [System.Globalization.CultureInfo]::InvariantCulture)
          $statusPath = 'outputs/results/validation_status.txt'
          if ($env:PREEI_VERIFY -ne 'true') {
            'SKIP: reference verification disabled.' | Tee-Object -FilePath $statusPath
          } else {
            $configPath = 'validation/reference_profiles.json'
            if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
              Write-Error "Missing $configPath. Commit the reference profile file."
              exit 1
            }
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $matched = @($config.profiles | Where-Object {
              $_.dataset_file -ieq $datasetName -and
              [double]::Parse([string]$_.lower_threshold, [System.Globalization.CultureInfo]::InvariantCulture) -eq $lower -and
              [double]::Parse([string]$_.upper_threshold, [System.Globalization.CultureInfo]::InvariantCulture) -eq $upper
            })
            if ($matched.Count -eq 0) {
              'SKIP: no matching reference for the selected dataset and thresholds.' |
                Tee-Object -FilePath $statusPath
            } elseif ($matched.Count -gt 1) {
              Write-Error 'Multiple reference profiles match this configuration.'
              exit 1
            } else {
              $reference = [string]$matched[0].reference_csv
              $actual = Join-Path 'outputs/results' ("PreEI_${datasetStem}_results.csv")
              if (-not (Test-Path -LiteralPath $reference -PathType Leaf)) {
                Write-Error "Reference file not found: $reference"
                exit 1
              }
              Write-Host "Checking results against $reference"
              python validation/compare_reference_counts.py $actual $reference |
                Tee-Object -FilePath $statusPath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Upload CSV, TXT, metadata and split batches
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preei-r9-run-${{ github.run_number }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
